name: Test and build native beta bundles
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PIP_CACHE_DIR: ${{ github.workspace }}/.cache/pip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0
      - name: Install development environment
        run: |
          python -m pip install uv==0.8.15
          python scripts/bootstrap.py
      - name: Core and broker process tests
        run: uv run --frozen --extra dev python scripts/check.py
      - name: Lint
        run: uv run --frozen --extra dev python -m ruff check src tests scripts
      - name: UI offscreen startup
        run: uv run --frozen --extra dev python scripts/run.py --smoke-test --data-dir .cache/ui-smoke
      - name: Build native bundle
        run: uv run --frozen --extra dev python scripts/build.py
      - name: Extracted native package acceptance (no model calls)
        run: uv run --frozen --extra dev python scripts/verify_native_package.py
      - name: Real Windows npm Codex compatibility (no login or model calls)
        if: runner.os == 'Windows'
        run: |
          npm install --global --prefix "$PWD/.cache/npm codex fixture" --no-audit --no-fund @openai/codex@0.163.0
          uv run --frozen --extra dev python scripts/verify_windows_npm_codex.py
      - name: Retain manually requested beta build
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: visor-beta-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
          retention-days: 7
