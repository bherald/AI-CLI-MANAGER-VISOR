[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-cli-manager-visor"
version = "1.4.0"
description = "A desktop supervisor for independent Codex and Claude Code terminals"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["PySide6-Essentials>=6.8,<7", "websockets>=15,<18", "psutil>=7,<8"]
classifiers = ["Development Status :: 4 - Beta", "Programming Language :: Python :: 3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "pyinstaller>=6,<7"]

[project.gui-scripts]
visor = "visor.__main__:main"

[project.scripts]
visor-console = "visor.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

